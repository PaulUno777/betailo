# CI de base pour le monorepo Betailo.
#
# Deux jobs indépendants (backend Go / frontend Angular), chacun limité à
# son dossier via `working-directory` — un job ne casse pas à cause de
# l'autre techno. À étendre plus tard : job Docker build, déploiement,
# scan de sécurité, etc.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so CI's toolchain (and its gofmt) can't drift
          # from the module's declared version.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Fichiers mal formatés (lancer 'make fmt') :"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (avec race detector)
        run: go test -race ./...

      # Vrai MongoDB (replica set, pour les transactions) démarré par
      # testcontainers — Docker est déjà disponible sur ubuntu-latest.
      - name: Tests d'intégration (MongoDB, testcontainers)
        run: go test -race -tags integration ./internal/integration/...

      - name: Build
        run: go build ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
          # The action's cached "latest" binary can lag behind the Go
          # version declared in go.mod (golangci-lint refuses to lint a
          # go.mod newer than the Go toolchain it was itself built
          # with). Building from source with the job's own Go toolchain
          # (see actions/setup-go above) sidesteps that entirely.
          install-mode: goinstall

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests (headless Chrome)
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build (production)
        run: pnpm run build --configuration production

  smoke:
    name: API smoke test (full stack)
    runs-on: ubuntu-latest
    # Only worth starting once the unit and integration tests pass.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      # Builds the API image and starts it with MongoDB and SeaweedFS
      # (docker-compose.yml), seeds a QA admin, then walks every
      # profile's flows through the real API (scripts/qa/api_smoke.py).
      - name: Run the smoke test
        run: scripts/qa/run_smoke.sh

      - name: Backend logs
        if: failure()
        run: docker compose logs backend

      - name: Stop the stack
        if: always()
        run: docker compose down -v

