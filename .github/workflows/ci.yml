# CI de base pour le monorepo Betailo.
#
# Deux jobs indépendants (backend Go / frontend Angular), chacun limité à
# son dossier via `working-directory` — un job ne casse pas à cause de
# l'autre techno. À étendre plus tard : job Docker build, déploiement,
# scan de sécurité, etc.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Format check (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Fichiers mal formatés (lancer 'make fmt') :"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (avec race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
          # The action's cached "latest" binary can lag behind the Go
          # version declared in go.mod (golangci-lint refuses to lint a
          # go.mod newer than the Go toolchain it was itself built
          # with). Building from source with the job's own Go toolchain
          # (see actions/setup-go above) sidesteps that entirely.
          install-mode: goinstall

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests (headless Chrome)
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build (production)
        run: pnpm run build --configuration production
