# CI de base pour le monorepo Betailo.
#
# Deux jobs indépendants (backend Go / frontend Angular), chacun limité à
# son dossier via `working-directory` — un job ne casse pas à cause de
# l'autre techno. À étendre plus tard : job Docker build, déploiement,
# scan de sécurité, etc.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Format check (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Fichiers mal formatés (lancer 'make fmt') :"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (avec race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build (production)
        run: npm run build -- --configuration production
