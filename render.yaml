# Render Blueprint for Betailo's backend — see
# https://render.com/docs/blueprint-spec. Deploy by connecting this repo
# in the Render dashboard ("New +" -> "Blueprint"); Render reads this
# file and creates the service below.
#
# Only the backend is defined here. The frontend is deployed on Vercel
# from frontend/ (see frontend/vercel.json and the "Déploiement"
# section of the README).
#
# MongoDB and object storage are NOT Render resources: Render has no
# managed MongoDB or S3-compatible storage offering, so both point at
# external services in production (MongoDB Atlas, Cloudflare R2) —
# `sync: false` below means "set this secret by hand in the Render
# dashboard", never committed here.
services:
  - type: web
    name: betailo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Render injects PORT itself for a web service; backend/cmd/api
      # already reads it (see internal/app.Application, which falls
      # back to 8080 only when PORT is unset — i.e. only in local dev).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: betailo
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      # Render can generate this itself (a random 256-bit value) —
      # never reuse the docker-compose.yml dev value in production.
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 24h
      # How many farms one account may own unless staff raise it for
      # that account.
      - key: MAX_FARMS_PER_ACCOUNT
        value: "1"
      # Test switch: "true" approves farms on submission without staff
      # review. Keep "false" once real sellers use the platform.
      - key: FARM_AUTO_APPROVE
        value: "false"
      # The root account (day zero): created or promoted at startup, a
      # super admin the API can never demote or suspend. Set both in the
      # Render dashboard; the password is only used when the account
      # doesn't exist yet. See backend/.env.example.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Staff must pass a second factor (authenticator app or passkey)
      # to use the back office. Each member sets one up at first
      # sign-in. See backend/.env.example, including how the root
      # account gets back in if its factor is lost.
      - key: STAFF_MFA_REQUIRED
        value: "true"
      # The site's public address: links in e-mails point there and
      # passkeys are bound to its host. Set it to the frontend's URL.
      - key: APP_PUBLIC_URL
        sync: false
      # Outgoing e-mail (staff invitations, password resets, farm
      # decisions). Set these in the Render dashboard from your SMTP
      # provider. Without SMTP_HOST, messages are only written to the log.
      # Port 2525 because Render's free instances block 25, 465 and 587;
      # it works on paid instances too (Brevo, Mailtrap, SMTP2GO offer it).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Refresh-token session (see docs/adr/0008). TTL and cookie
      # attributes are plain config, not secrets — only SAMESITE is
      # "none" rather than "lax" because the frontend and backend are
      # on different origins in production today (no nginx /api proxy
      # is actually wired up yet, despite the architecture doc).
      - key: REFRESH_TOKEN_TTL
        value: 720h
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # Render's proxy overwrites X-Forwarded-For, so auth rate limiting
      # can key on the real client IP.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # The deployed frontend's origin (the Vercel address, no trailing
      # slash). Unset, only http://localhost:4200 may call the API.
      - key: CORS_ALLOWED_ORIGIN
        sync: false
